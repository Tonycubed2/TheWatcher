; TheWatcher.ini  -  The Watcher version 10  -  goes in Data\SKSE\Plugins\
; VERSION 10: extensive logging, no dumps by default, and no continuous thread suspension.
; External snapshot and supplemental context report are serialized; one automatic capture per stall.
; Output goes to Documents\My Games\Skyrim Special Edition\SKSE\ (TheWatcher.log and the TheWatcher\ folder).

[General]
; 0 = off
; 1 = normal:     watch for stalls, capture evidence when one happens, log one line per loading screen
; 2 = diagnostic logging profile: stats enabled and overrides below applied.
;     Version 10 no longer enables heavy continuous stack sampling or dumps by default.
;                 Any key in the [Aggressive] section below replaces the normal value when iMode=2.
iMode=2

; Write a stats row (CSV) every iStatsIntervalSeconds. Aggressive mode always does this.
bStatsLog=1
iStatsIntervalSeconds=5

; A single frame longer than this (milliseconds) counts as a "hitch" in the stats
fHitchMs=100

; Housekeeping: how many stats files and stall-capture folders to keep (oldest are deleted)
iKeepStatsFiles=20
iKeepStallCaptures=10
; Total soft cap for the TheWatcher subfolder, in MiB. 0 = unlimited.
; Deletes oldest dumps first, then old text files. Active/recent logs are protected.
; Enforced outside loading/captures every 60 seconds; optional dumps may exceed it while writing.
iMaxStorageMB=1024

[Detection]
; No automatic captures during loading unless explicitly enabled here. F12 still works.
bCaptureLoadingStalls=0
; Pause profiling, CSV stats, equip logging and slow stack sampling during loading.
bReduceWorkDuringLoading=1
; Outside loading screens: the main thread has not finished a frame for this many seconds = stall.
; The game must stop finishing frames for 8 seconds before automatic capture.
fFrameStallSeconds=8

; Loading screen open with no load progress (objects/cells loading) for this long = warning in the log.
; Some parts of a load (script setup at the end of a save load, for example) fire no load events.
fLoadWarnSeconds=60

; No observed load events for this long = capture ONLY if bCaptureLoadingStalls=1.
; A quiet loading phase does not prove a freeze.
fLoadStallSeconds=300

; Legacy interval retained; version 10 permits only one automatic capture per stall.
fRecaptureSeconds=30
iMaxCapturesPerSession=20

; Legacy key retained for clarity. Version 10 ignores it: focus NEVER suppresses captures.
bIgnoreWhenUnfocused=0

[Independent]
; Starts TheWatcherDump.exe as a persistent monitor at DataLoaded, before gameplay.
; It accepts the hotkey outside Skyrim. Shared capture ownership prevents overlapping diagnostics.
; Rearms only after a 5-second post-capture cooldown AND 2 seconds of fresh frame/load progress.
bIndependentWatchdog=1
; Emergency frame capture after this many seconds; loading uses fLoadStallSeconds.
; Alt+Tab or pausing background rendering may produce an extra capture, deliberately.
fIndependentFrameSeconds=8

[Capture]
; Write the main thread's call stack to the log and to stacks.txt
bMainThreadStack=1

; Also record every other thread: their call stacks AND the sampling below (long output, but shows loader/worker threads).
; With this off, only the main thread is recorded and sampled.
bAllThreadStacks=0

; Minidump written when a stall is captured:
;   0 = none
;   1 = small: all thread stacks + module list, usually a few MB  (small enough to upload)
;   2 = medium: adds memory the stacks point to, tens of MB
;   3 = full memory: roughly the size of Skyrim's RAM use (10-20+ GB) and slow to write
iMinidumpLevel=0
; Full memory dumps require this extra opt-in, protecting users with an old level-3 INI.
bAllowFullMemoryDump=0

; Write the minidump with TheWatcherDump.exe (must sit next to TheWatcher.dll) instead of from inside the frozen game.
; Version 10 skips a dump if the helper is unavailable; no in-process fallback.
bOutOfProcessDump=1

; Copy every SKSE log written this session into the capture folder, so relaunching can't wipe them
bBackupLogs=1

; Alerts: three beeps + flashing taskbar button on a capture
bBeep=1
bFlashWindow=1
; One short beep when a warning starts (loading slow, before it counts as a stall)
bAlertOnWarning=1

; Label SkyrimSE.exe stack frames with Address Library IDs ("SkyrimSE.exe+02EACBA -> 12345+0x1A"), like CrashLogger.
; Reads Data\SKSE\Plugins\versionlib-<game version>.bin on AE, or version-<game version>.bin on SE
; (both installed by Address Library for SKSE Plugins).
bAddressLibraryIDs=1

; Sample threads this many times per capture, iSampleIntervalMs apart, and label each one:
;   SAME       stack never changed (stuck, OR simply idle/asleep - most idle threads look like this)
;   CHANGED    it ran different code between samples
;   INCOMPLETE a sample could not be taken
; Clues for where to look, not proof. Samples the main thread only unless bAllThreadStacks=1. 1 turns sampling off.
iThreadSamples=1
iSampleIntervalMs=100

; (1.1) Print identical thread stacks once with a thread count (a capture had 320 idle threads -> 151 KB)
bGroupThreadStacks=1

; (1.1) If the game is already running again when the stack is taken, the capture is "recovered": the main-thread
; stack then shows ordinary work, not the stall. Write only stacks.txt/summary.json (with the stack history taken
; DURING the stall), skip the minidump, all-thread pass and thread sampling, and don't count it toward iMaxCapturesPerSession.
bSkipDumpIfRecovered=1

; (version 6) Wait chains: ask Windows which thread is waiting for which lock, and which thread owns it.
; Turns a deadlock into a one-line answer ("thread X waits for a critical section owned by the MAIN thread"),
; flags real deadlocks (chains that loop), and adds the stacks of the threads involved. Reads Windows' own
; bookkeeping without pausing anything, so it is safe while the game is stuck. It can see critical sections,
; mutexes, SendMessage and COM/ALPC calls, and thread/process waits; it cannot see who owns events, semaphores,
; SRW locks or the game's own spin locks.
bWaitChains=1

[Sampling]
; (1.1) Main-thread stack history. While a frame is taking too long (or a loading screen has had no progress for
; a while) the main thread's stack is sampled every iSlowSampleIntervalMs. When it ends, the samples are summarized
; (most common stack, hot frames, modules on the stack) in TheWatcher.log and TheWatcher\slow_<date_time>.jsonl.
; A stall capture includes the same history, so it has evidence even if the game recovers before the capture.
bSlowSampling=0
; Start sampling once the current frame has taken this long (seconds)
fHitchSampleSeconds=0.5
; Report a hitch only if it lasted at least this long
fHitchReportSeconds=1.0
; Loading screens: start sampling (and report) after this long with no load progress
fLoadGapSampleSeconds=2.0
iSlowSampleIntervalMs=100
iMaxSlowReportsPerSession=1000

[Context]
; (1.1) Extra columns in the stats CSV (appended after the original 24):
;   worldspace, exterior cell grid + player position, location name, open menus,
;   mid-high / low / spawned (FF) actor counts and top plugins by actor base
bActorBreakdown=1
;   Papyrus VM load: running stacks, latent waits, queued calls, overstressed flag
bPapyrusStats=1
;   Per-process video memory: local use, budget, and non-local (spilled to system RAM)
bVramStats=1
; TheWatcher\status.json rewritten every second (every 10 seconds during reduced-work loading) (state, heartbeat age, context) - readable even while the game hangs
bStatusFile=1
; TheWatcher\events_<date_time>.log: one flushed line per load, menu, cell change, save, fast travel, hitch, capture.
; The last lines before a crash survive it; compare with CrashLogger's crash-*.log timestamp.
bEventsLog=1
; Also log equip/unequip (player only unless bEquipAllActors=1, which is much noisier)
bEquipEvents=1
bEquipAllActors=0
iKeepEventFiles=20

[Hotkey]
; Hold this key to save everything right now: logs, a report with thread stacks and the resource report, and
; (optionally) a minidump. It works while the game is frozen, too, and is accepted even when Skyrim is not the foreground window.
; The key still reaches Windows and the game as normal (if another mod uses it, that mod reacts as well).
; Independent evidence goes to TheWatcher\independent_manual_<date>_<time>_<n>\.
; If the in-game watchdog responds afterwards, it also saves the usual manual_ report.
bHotkeyEnabled=1
; The key. Any of: F1-F24, Pause, ScrollLock, Insert, Delete, Home, End, PageUp, PageDown, A-Z, 0-9,
; Numpad0-Numpad9, or a raw virtual-key code like 0x7B. You can add Shift, Ctrl or Alt (example: Ctrl+F12),
; but a single key held down is the most reliable. PrintScreen is not recommended: Windows often does not
; report it as held down.
sHotkey=F12
; Hold the key this many seconds to start the capture. Default 0 captures on a press.
; 0 = capture as soon as the key is pressed. Version 10 ships with 0 for short freeze-to-crash cases.
fHotkeyHoldSeconds=0
; Also write a minidump on a manual capture (iMinidumpLevel decides the size)
bHotkeyMinidump=1
iKeepManualCaptures=10

[Resources]
; Which mods are using CPU. Every iResourceIntervalMs, The Watcher measures three things, as "% of one CPU core"
; (100% = one core fully busy):
;   CPU by thread owner        every thread's CPU time, credited to the DLL that runs the thread (threads started
;                              through the C runtime are traced back to the DLL that created them)
;   Mod code running           on the busiest game threads, whose code was executing at that moment
;                              (strongest evidence that a mod itself is using the time)
;   Nearest mod on call stacks the innermost mod whose hook led into the busy game code (a pointer, not proof)
; Shown in every capture report, and written every iResourceWindowSeconds to TheWatcher\resources_<date>_<time>.log.
bResourceProfiler=1
iResourceIntervalMs=500
iResourceWindowSeconds=60
; How many mods to list
iResourceTop=50
; How many of the busiest game threads to sample each interval (0 = only the thread-owner view)
iResourceSampleThreads=0
; Write the per-window summary to resources_<date>_<time>.log
bResourceLog=1

[Aggressive]
; Used only when iMode=2. Add any key from the sections above to override it here.
fFrameStallSeconds=8
; Loading uses separate no-progress thresholds; normal save/load pauses are not 8-second frame stalls.
fLoadWarnSeconds=60
fLoadStallSeconds=300
fRecaptureSeconds=30
iMaxCapturesPerSession=20
bAllThreadStacks=0
; Dumps disabled. Level 1 is available as an explicit optional small dump.
iMinidumpLevel=0
iStatsIntervalSeconds=5
