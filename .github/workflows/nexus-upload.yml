name: Upload to Nexus Mods

# Manual release: Actions tab -> "Upload to Nexus Mods" -> Run workflow.
# Uploads Tony's own build: release/TheWatcher-<version>.zip committed to main.
# Nothing is built here. Checks the zip holds the DLL, the helper EXE and the INI, then uploads it as a new
# version of the main file on Nexus.
#
# Needs, in the "nexus" environment (Settings -> Environments -> nexus):
#   secret   NEXUSMODS_API_KEY  - personal API key from nexusmods.com/settings/api-keys
#   variable NEXUSMODS_FILE_ID  - "File ID" of the main file (Files tab -> Advanced -> API), or pass file_id below
#   variable NEXUSMODS_MOD_ID   - optional, "Unique Mod ID" (same dialog), for the changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown on Nexus (e.g. 16); release/TheWatcher-<version>.zip must be on main"
        required: true
      changelog:
        description: "Changelog text (optional, plain text; use ' | ' to separate lines)"
        required: false
        default: ""
      file_id:
        description: "Nexus File ID of the main file (Files tab -> Advanced -> API -> File ID)"
        required: false
        default: ""
      display_name:
        description: "File name shown on Nexus"
        required: false
        default: "The Watcher"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: nexus
    steps:
      - name: Check settings
        env:
          FILE_ID: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          HAS_KEY: ${{ secrets.NEXUSMODS_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Secret NEXUSMODS_API_KEY is missing in the nexus environment"; exit 1; fi
          if [ -z "$FILE_ID" ]; then echo "::error::No File ID: pass file_id or set NEXUSMODS_FILE_ID in the nexus environment"; exit 1; fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Take the release zip (Tony's build)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ ! -f "main/release/TheWatcher-$VERSION.zip" ]; then echo "::error::main/release/TheWatcher-$VERSION.zip is missing"; exit 1; fi
          cp "main/release/TheWatcher-$VERSION.zip" TheWatcher.zip
          unzip -l TheWatcher.zip
          for f in SKSE/Plugins/TheWatcher.dll SKSE/Plugins/TheWatcherDump.exe SKSE/Plugins/TheWatcher.ini; do
            if ! unzip -l TheWatcher.zip | grep -q " $f\$"; then echo "::error::MISSING $f in the zip - not uploading"; exit 1; fi
          done

      - name: Format changelog
        id: log
        if: ${{ inputs.changelog != '' }}
        env:
          TEXT: ${{ inputs.changelog }}
        run: |
          {
            echo "text<<CHANGELOG_EOF"
            printf '%s\n' "$TEXT" | sed 's/ | /\n/g'
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Nexus Mods
        uses: Nexus-Mods/upload-action@main
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ inputs.file_id || vars.NEXUSMODS_FILE_ID }}
          filename: TheWatcher.zip
          display_name: ${{ inputs.display_name }}
          version: ${{ inputs.version }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          changelog: ${{ steps.log.outputs.text }}
          update_mod_version: true
